<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:     #0d0d0d;
  --bg2:    #111111;
  --bg3:    #181818;
  --border: #222;
  --text:   #e8e4dc;
  --muted:  #666;
  --faint:  #333;
  --red:    #c0392b;
  --mono:   'DM Mono', 'Courier New', monospace;
  --sans:   'DM Sans', Helvetica Neue, Arial, sans-serif;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Scroll reveal */
.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.7s cubic-bezier(.25,.46,.45,.94), transform 0.7s cubic-bezier(.25,.46,.45,.94);
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}
.reveal-d1 { transition-delay: 0.1s; }
.reveal-d2 { transition-delay: 0.2s; }
.reveal-d3 { transition-delay: 0.3s; }
.reveal-d4 { transition-delay: 0.4s; }
.reveal-d5 { transition-delay: 0.5s; }

/* Selection */
::selection { background: var(--red); color: #fff; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Top stripe */
#top-stripe {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--red);
  z-index: 100;
}

/* Nav */
nav {
  position: sticky;
  top: 4px;
  z-index: 90;
  background: rgba(13,13,13,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 54px;
}

.nav-logo {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--text);
  text-decoration: none;
}

.nav-links {
  display: flex;
  gap: 36px;
  list-style: none;
}

.nav-links a {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
  transition: color 0.2s;
  position: relative;
}
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 0; right: 0;
  height: 1px;
  background: var(--red);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.2s;
}
.nav-links a:hover { color: var(--text); }
.nav-links a:hover::after { transform: scaleX(1); }

.nav-cta {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text);
  text-decoration: none;
  padding: 7px 16px;
  border: 1px solid var(--border);
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.nav-cta:hover {
  border-color: var(--red);
  color: var(--red);
}

/* Section label */
.sec-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.sec-num {
  color: var(--red);
  margin-right: 6px;
}

/* ─── HERO ─── */

.hero-tagline {

.hero-name {

  line-height: 0.92;

.hero-name em {

}

.hero-rule {

.hero-rule div:first-child { background: var(--red); height: 2px; }

.hero-desc {

.hero-btns {

.btn-primary {

.btn-secondary {

/* ─── PROJECTS ─── */

.sec-header {

  justify-content: space-between;

.sec-title {

}

.projects-grid {
  display: grid;

.project-card {
  padding: 36px 40px 32px;
  border-right: 1px solid var(--border);

  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 240px;
  cursor: pointer;
  position: relative;
  overflow: visible;
  transition: background 0.3s, transform 0.12s ease-out, box-shadow 0.12s ease-out;
  will-change: transform;
  transform-style: preserve-3d;
}
.project-card:nth-child(3n) { border-right: none; }
.project-card:hover { background: var(--bg3); }

.project-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--red);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s cubic-bezier(.25,.46,.45,.94);
}
.project-card:hover::before { transform: scaleX(1); }

.project-num {
  font-family: var(--mono);
  font-size: 11px;

.project-title {

  font-weight: 700;

.project-desc {

// ── Scroll reveal hook ───────────────────────────────────────────
function useReveal(lang) {
  useEffect(() => {
    const timer = setTimeout(() => {
      const els = document.querySelectorAll('.reveal');
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
      els.forEach(el => { el.classList.remove('visible'); obs.observe(el); });
      return () => obs.disconnect();
    }, 50);
    return () => clearTimeout(timer);
  }, [lang]);
}

// ── StatCounter — driven by shared progress prop ────────────────
function StatCounter({ num, unit, label, progress }) {
  const target = parseInt(num, 10);
  const display = Math.round((1 - Math.pow(1 - Math.min(progress, 1), 3)) * target);
  return (
    <div className="hero-stat">
      <div className="hero-stat-num">{display}<span>{unit}</span></div>
      <div className="hero-stat-label">{label}</div>
    </div>
  );
}

// ── TiltCard — 3D perspective tilt on hover ──────────────────────
function TiltCard({ children, className, href }) {
  const ref = useRef(null);

  const handleMove = (e) => {
    const card = ref.current;
    if (!card) return;
    const rect = card.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    card.style.transform = `perspective(700px) rotateY(${x * 10}deg) rotateX(${-y * 7}deg) translateZ(6px)`;
    card.style.boxShadow = `${-x * 12}px ${-y * 12}px 30px rgba(0,0,0,0.5)`;
  };

  const handleLeave = () => {
    const card = ref.current;
    if (!card) return;
    card.style.transform = 'perspective(700px) rotateY(0deg) rotateX(0deg) translateZ(0)';
    card.style.boxShadow = 'none';
  };

  return (
    <a ref={ref} href={href} className={className}
      onMouseMove={handleMove} onMouseLeave={handleLeave}
      style={{textDecoration:'none'}}>
      {children}
    </a>
  );
}

function Hero({ tweaks, lang }) {
  const t = T[lang].hero;
  const [progress, setProgress] = useState(0);
  const statsRef = useRef(null);

  useEffect(() => {
    setProgress(0);
    let raf;
    const DURATION = 1400;

    const startAnim = () => {
      let start = null;
      const step = (ts) => {
        if (!start) start = ts;
        const p = Math.min((ts - start) / DURATION, 1);
        setProgress(p);
        if (p < 1) raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
    };

    const container = statsRef.current;
    if (!container) return;

    if (container.classList.contains('visible')) {
      startAnim();
    } else {
      const mut = new MutationObserver(() => {
        if (container.classList.contains('visible')) {
          mut.disconnect();
          startAnim();
        }
      });
      mut.observe(container, { attributes: true, attributeFilter: ['class'] });
      return () => { mut.disconnect(); cancelAnimationFrame(raf); };
    }
    return () => cancelAnimationFrame(raf);
  }, [lang]);
  return (
    <section id="hero">
      <div className="hero-left">
        <div>
          <p className="hero-tagline reveal">{t.tagline}</p>
          <h1 className="hero-name reveal reveal-d1">
            <em>Matthis</em>

        </div>
        <div className="hero-btns reveal reveal-d4">
          <a href="#projects" className="btn-primary">{t.cta}</a>
          <a href={T[lang].resumeUrl} target="_blank" rel="noopener noreferrer" className="btn-secondary">{t.cv}</a>
        </div>
      </div>

      <div className="hero-right">
        <div className="hero-stats reveal reveal-d1" ref={statsRef}>
          {t.stats.map((s, i) =>
          <StatCounter key={i} num={s.num} unit={s.unit} label={s.label} progress={progress} />
          )}
        </div>
        <div className="hero-links reveal reveal-d2">
          <a href="https://github.com/MattRoda" target="_blank" rel="noopener noreferrer" className="hero-link-row">
            <span className="hero-link-label">GitHub</span>
            <span className="hero-link-val">MattRoda</span>
            <span className="hero-link-arrow">→</span>
          </a>
          <a href="https://linkedin.com/in/matthis-roda" target="_blank" rel="noopener noreferrer" className="hero-link-row">

          </a>
        </div>
      </div>
    </section>);

}
