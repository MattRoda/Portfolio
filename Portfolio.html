<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:     #0d0d0d;
  --bg2:    #111111;
  --bg3:    #181818;
  --border: #222;
  --text:   #e8e4dc;
  --muted:  #666;
  --faint:  #333;
  --red:    #c0392b;
  --mono:   'DM Mono', 'Courier New', monospace;
  --sans:   'DM Sans', Helvetica Neue, Arial, sans-serif;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Scroll reveal */
.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.7s cubic-bezier(.25,.46,.45,.94), transform 0.7s cubic-bezier(.25,.46,.45,.94);
}
.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}
.reveal-d1 { transition-delay: 0.1s; }
.reveal-d2 { transition-delay: 0.2s; }
.reveal-d3 { transition-delay: 0.3s; }
.reveal-d4 { transition-delay: 0.4s; }
.reveal-d5 { transition-delay: 0.5s; }

/* Selection */
::selection { background: var(--red); color: #fff; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Top stripe */
#top-stripe {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--red);
  z-index: 100;
}

/* Nav */
nav {
  position: sticky;
  top: 4px;
  z-index: 90;
  background: rgba(13,13,13,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  height: 54px;
}

.nav-logo {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.14em;
  color: var(--text);
  text-decoration: none;
}

.nav-links {
  display: flex;
  gap: 36px;
  list-style: none;
}

.nav-links a {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
  transition: color 0.2s;
  position: relative;
}
.nav-links a::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 0; right: 0;
  height: 1px;
  background: var(--red);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.2s;
}
.nav-links a:hover { color: var(--text); }
.nav-links a:hover::after { transform: scaleX(1); }

.nav-cta {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text);
  text-decoration: none;
  padding: 7px 16px;
  border: 1px solid var(--border);
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.nav-cta:hover {
  border-color: var(--red);
  color: var(--red);
}

/* Section label */
.sec-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}
.sec-num {
  color: var(--red);
  margin-right: 6px;
}

/* ─── HERO ─── */
#hero {
  min-height: calc(100vh - 58px);
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-bottom: 1px solid var(--border);
}

.hero-left {
  padding: 80px 48px 80px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.hero-tagline {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--red);
  text-transform: uppercase;
  margin-bottom: 32px;
}

.hero-name {
  font-size: clamp(52px, 6vw, 86px);
  font-weight: 900;
  line-height: 0.92;
  letter-spacing: -0.035em;
  color: var(--text);
  margin-bottom: 20px;
}

.hero-name em {
  font-style: italic;
  font-weight: 300;
  color: var(--muted);
  display: block;
}

.hero-rule {
  display: grid;
  grid-template-columns: 1fr 3fr;
  gap: 0;
  margin-bottom: 32px;
}
.hero-rule div:first-child { background: var(--red); height: 2px; }
.hero-rule div:last-child  { background: var(--border); height: 2px; }

.hero-desc {
  font-size: 15px;
  color: var(--muted);
  line-height: 1.8;
  max-width: 380px;
  margin-bottom: 40px;
}

.hero-desc strong {
  color: var(--text);
  font-weight: 400;
}

.hero-btns {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}
